openapi: 3.0.3
info:
  title: Kakka API
  description: |
    Task manager with temporal knowledge graph and natural language chat.

    Every task CRUD operation syncs to a knowledge graph (MemPalace) that stores
    entities and relationships as versioned triples. The chat engine queries
    this graph using pattern matching — no LLM required.
  version: 1.0.0
  contact:
    name: Kakka
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /api/tasks:
    get:
      summary: List tasks
      description: |
        Returns non-archived tasks by default. Use query parameters to filter
        by tag, status, date, or archive status. Results ordered by sort_order
        then id.
      operationId: listTasks
      parameters:
        - name: tag
          in: query
          description: Filter by tag (exact match within JSON array)
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: "Filter by status: todo, progress, or done"
          required: false
          schema:
            type: string
            enum: [todo, progress, done]
        - name: date
          in: query
          description: Filter by creation date (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: archived
          in: query
          description: "true = show archived only, omit/false = show non-archived"
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskOut"
              example:
                - id: 1
                  title: "Design landing page wireframes"
                  description: "Create low-fidelity wireframes for the new product landing page"
                  status: "todo"
                  done: false
                  tags: ["work", "urgent"]
                  project: ""
                  archived: false
                  sort_order: 0
                  due_date: ""
                  created_at: "2025-01-15T10:00:00+00:00"
                  updated_at: "2025-01-15T10:00:00+00:00"

    post:
      summary: Create a task
      description: |
        Creates a new task and syncs it to the knowledge graph (entity + triples
        for tags, project, and status).
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
            example:
              title: "Write docs"
              status: "todo"
              tags: ["work"]
              project: "kakka"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskOut"

  /api/tasks/reorder:
    put:
      summary: Reorder tasks
      description: |
        Sets the sort order of tasks based on the position in the provided
        array. Must be registered before /api/tasks/{id} in the router.
      operationId: reorderTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
            example: [3, 1, 2, 5, 4]
      responses:
        "200":
          description: Reorder successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/tasks/{task_id}:
    put:
      summary: Update a task
      description: |
        Partial update of a task. Only provided fields are updated. Changing
        status, tags, or project triggers knowledge graph sync hooks to expire
        old triples and create new ones.
      operationId: updateTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
            example:
              status: "done"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskOut"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a task
      description: |
        Permanently deletes a task. All knowledge graph triples for this task
        are expired (valid_to set to current timestamp).
      operationId: deleteTask
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tags:
    get:
      summary: List all tags
      description: Returns a sorted list of all unique tags across all tasks.
      operationId: listTags
      responses:
        "200":
          description: List of tag names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["idea", "personal", "urgent", "work"]

  /api/graph:
    get:
      summary: Get full knowledge graph
      description: |
        Returns all entities and current (non-expired) triples for rendering
        the force-directed graph visualization.
      operationId: getGraph
      responses:
        "200":
          description: Graph data with nodes and edges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphData"

  /api/graph/stats:
    get:
      summary: Get graph statistics
      description: |
        Returns counts of entities, triples, current facts, expired facts,
        and breakdown by relationship type.
      operationId: getGraphStats
      responses:
        "200":
          description: Graph statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphStats"

  /api/graph/entity/{entity_id}:
    get:
      summary: Get entity detail
      description: |
        Returns a single entity with all its outgoing and incoming triples
        (current only, valid_to IS NULL).
      operationId: getEntity
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
          description: "Entity ID, e.g. task:1, tag:work, project:kakka"
      responses:
        "200":
          description: Entity with connected triples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityDetail"
        "404":
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/graph/timeline/{entity_id}:
    get:
      summary: Get entity timeline
      description: |
        Returns the full temporal history of an entity, including both current
        and expired triples. Each triple includes a "current" boolean
        indicating whether the fact is still active.
      operationId: getEntityTimeline
      parameters:
        - name: entity_id
          in: path
          required: true
          schema:
            type: string
          description: "Entity ID, e.g. task:1"
      responses:
        "200":
          description: Timeline of all triples involving this entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTimeline"

  /api/chat:
    post:
      summary: Chat with Kakka
      description: |
        Send a natural language message and receive a response based on
        pattern matching against the knowledge graph. Supports:

        - **Queries**: tag filters ("show work tasks"), status filters
          ("what's in progress?"), project filters, entity lookups,
          keyword search, task references ("task #3")
        - **Actions**: "mark #3 as done", "start #1", "reopen #5"
        - **Creation**: "add task Title with description Desc"

        When any task reference has `changed: true`, the frontend should
        reload the task list.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
            example:
              messages:
                - role: "user"
                  content: "show me urgent tasks"
      responses:
        "200":
          description: Chat response with optional task references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
              example:
                content: "**To Do** (2)\n- **[Task #1](task:1)** Design landing page wireframes · urgent, work\n- **[Task #6](task:6)** Set up CI/CD pipeline · work\n\nFiltered by: urgent"
                tasks:
                  - id: 1
                    title: "Design landing page wireframes"
                    status: "todo"
                    changed: false
                  - id: 6
                    title: "Set up CI/CD pipeline"
                    status: "todo"
                    changed: false

components:
  schemas:
    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Task title
        description:
          type: string
          default: ""
          description: Optional description (supports markdown)
        status:
          type: string
          default: "todo"
          enum: [todo, progress, done]
        tags:
          type: array
          items:
            type: string
          default: []
          description: "List of tags, e.g. [\"work\", \"urgent\"]"
        project:
          type: string
          default: ""
          description: Optional project grouping (stored as `grp` in DB)
        due_date:
          type: string
          default: ""
          description: Optional ISO date string

    TaskUpdate:
      type: object
      description: All fields optional. Only provided fields are updated.
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, progress, done]
        tags:
          type: array
          items:
            type: string
        project:
          type: string
        archived:
          type: boolean
          description: "true to archive, false to unarchive"
        sort_order:
          type: integer
        due_date:
          type: string

    TaskOut:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, progress, done]
        done:
          type: boolean
          description: "Derived: true when status == 'done'"
        tags:
          type: array
          items:
            type: string
        project:
          type: string
          description: "Project name (mapped from `grp` column in DB)"
        archived:
          type: boolean
        sort_order:
          type: integer
        due_date:
          type: string
        created_at:
          type: string
          description: ISO 8601 timestamp
        updated_at:
          type: string
          description: ISO 8601 timestamp

    EntityOut:
      type: object
      description: Knowledge graph node (entity)
      properties:
        id:
          type: string
          description: "Namespaced ID, e.g. task:1, tag:work, project:kakka, status:todo"
        name:
          type: string
          description: Human-readable label
        type:
          type: string
          enum: [task, tag, project, concept]
          description: Entity type
        properties:
          type: string
          description: "JSON string, e.g. '{\"color\": \"sage\"}'"
        created_at:
          type: string
          description: ISO 8601 timestamp

    TripleOut:
      type: object
      description: Knowledge graph edge (relationship between entities)
      properties:
        id:
          type: integer
        subject:
          type: string
          description: "Source entity ID, e.g. task:1"
        predicate:
          type: string
          enum: [has_tag, belongs_to, has_status]
          description: Relationship type
        object:
          type: string
          description: "Target entity ID, e.g. tag:work"
        valid_from:
          type: string
          description: ISO timestamp when this fact became true
        valid_to:
          type: string
          nullable: true
          description: "ISO timestamp when expired, or null if current"
        confidence:
          type: number
          format: float
          default: 1.0
          description: Confidence score (always 1.0 for auto-synced facts)
        source_task_id:
          type: integer
          nullable: true
          description: ID of the task that created this triple
        created_at:
          type: string
          description: ISO 8601 timestamp

    GraphData:
      type: object
      description: Full knowledge graph response
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/EntityOut"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/TripleOut"

    GraphStats:
      type: object
      description: Knowledge graph statistics
      properties:
        entities:
          type: integer
          description: Total entity count
        triples:
          type: integer
          description: Total triple count (including expired)
        current_facts:
          type: integer
          description: Number of current (non-expired) triples
        expired_facts:
          type: integer
          description: Number of expired triples
        relationship_types:
          type: object
          additionalProperties:
            type: integer
          description: "Count of current triples by predicate, e.g. {\"has_tag\": 5, \"belongs_to\": 3, \"has_status\": 7}"

    EntityDetail:
      type: object
      description: Single entity with its connected triples
      properties:
        entity:
          $ref: "#/components/schemas/EntityOut"
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/TripleOut"
          description: Triples where this entity is the subject
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/TripleOut"
          description: Triples where this entity is the object

    EntityTimeline:
      type: object
      description: Temporal history of all triples involving an entity
      properties:
        entity_id:
          type: string
        timeline:
          type: array
          items:
            type: object
            properties:
              subject:
                type: string
              predicate:
                type: string
              object:
                type: string
              valid_from:
                type: string
              valid_to:
                type: string
                nullable: true
              current:
                type: boolean
                description: "true if valid_to is null (fact is currently active)"

    TaskRef:
      type: object
      description: Lightweight task reference returned in chat responses
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [todo, progress, done]
        changed:
          type: boolean
          default: false
          description: "true if an action modified this task (frontend should reload)"

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
          description: Conversation history (only the last message is processed)

    ChatResponse:
      type: object
      properties:
        content:
          type: string
          description: "Markdown-formatted response with [Task #ID](task:ID) links"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskRef"
          description: Referenced tasks with changed flag

    Error:
      type: object
      properties:
        detail:
          type: string